# Produção (DEPLOY.md). Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Só o Caddy expõe portas (80/443). Banco, API e frontend ficam na rede interna.
name: ponto

x-backend-env: &backend-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ponto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ponto}
  JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
  BIOMETRIC_KEY: ${BIOMETRIC_KEY:?defina BIOMETRIC_KEY no .env}
  BIOMETRIC_KEY_ID: ${BIOMETRIC_KEY_ID:-k1}
  COOKIE_SECURE: "true"
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
  CORS_ORIGINS: "[]" # frontend e API na mesma origem
  LOG_FORMAT: json
  FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.363}
  FACE_MATCH_MARGIN: ${FACE_MATCH_MARGIN:-0.05}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ponto}
      POSTGRES_USER: ${POSTGRES_USER:-ponto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ./backend
      target: base
    restart: unless-stopped
    environment:
      <<: *backend-env
      # Confia no X-Forwarded-For só vindo dos proxies desta rede (nginx do frontend e Caddy).
      FORWARDED_ALLOW_IPS: 172.30.0.0/24
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # Limpeza diária: expurgo da biometria excluída há 30 dias e de tokens vencidos.
  scheduler:
    build:
      context: ./backend
      target: base
    restart: unless-stopped
    environment: *backend-env
    command: ["sh", "-c", "while :; do python -m app.cli maintenance; sleep 86400; done"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
      TLS_MODE: ${TLS_MODE:-public}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    networks: [internal]

  # Backup diário do banco no volume "backups" (copie para fora do servidor — DEPLOY.md §6).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ponto}
      POSTGRES_USER: ${POSTGRES_USER:-ponto}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
