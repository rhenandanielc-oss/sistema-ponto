# Serve o frontend e encaminha /api ao backend: mesma origem para o cookie de sessão.
# HTTPS fica no proxy de borda (Fase 6); o kiosk exige HTTPS para usar a câmera.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Atenção: add_header dentro de um location anula os cabeçalhos de segurança acima.
    # Para cache, use "expires", que não interfere neles.
    location /assets/ {
        expires 1y;
    }

    # Rotas do React Router (/funcionarios, /historico, ...) caem no index.html.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
